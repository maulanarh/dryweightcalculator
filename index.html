<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuitansi Jual Beli Emas</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d1b16;--mute:#6b665b;--line:#d9d4c7;--gold:#8a6a1f;--btn:#1f4d3a;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--card:#201f17;--ink:#f1eee4;--mute:#a8a291;--line:#3a382c;--gold:#d8b45a;--btn:#d8b45a;--btnt:#1d1b16;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.full{grid-column:1/-1}
h2{font-size:15px;margin:14px 0 8px;color:var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{flex:1 1 140px;padding:11px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);font:inherit;cursor:pointer}
.acts button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
#msg{font-size:13px;color:var(--mute);min-height:20px;margin-top:8px}
.scroll{overflow-x:auto}
#kw{background:#fff;color:#1d1b16;border:2px solid #1d1b16;padding:26px;min-width:560px;font-family:Georgia,"Times New Roman",serif}
#kw h3{margin:0;text-align:center;font-size:22px;letter-spacing:1px}
#kw .no{text-align:center;font-size:13px;margin:2px 0 16px}
#kw table{width:100%;border-collapse:collapse;font-size:14px}
#kw td{padding:5px 4px;vertical-align:top}
#kw td:first-child{width:30%}
#kw .amt{margin:16px 0;padding:10px 14px;border:1px solid #1d1b16;font-size:20px;font-weight:bold}
#kw .tb{font-style:italic;font-size:14px;margin-bottom:14px}
#kw .ttd{display:flex;justify-content:space-between;text-align:center;margin-top:18px;font-size:14px}
#kw .ttd div{width:45%}
#kw .sp{height:70px}
#kw .note{font-size:11px;margin-top:16px;border-top:1px solid #999;padding-top:6px}
#kw .it{margin-top:10px}
#kw .br{text-align:center;font-size:13px;font-weight:bold;margin-bottom:4px}
#kw .it th,#kw .it td{border:1px solid #777;padding:6px;text-align:left;width:auto}
#kw .it th{background:#eee}
#kw .it td:first-child{width:auto}
@media print{
@page{size:auto;margin:8mm}
:root{padding:0!important}
html,body{background:#fff;margin:0;padding:0;height:auto}
.wrap{padding:0;margin:0;max-width:none;width:100%}
.noprint{display:none!important}
.scroll{overflow:visible;width:100%}
#kw{min-width:0;width:100%;max-width:100%;margin:0;padding:12px;border:2px solid #000;break-inside:avoid;page-break-inside:avoid;overflow:hidden;font-size:12px}
#kw .it th,#kw .it td{padding:4px;word-break:break-word}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="noprint">
<h1>Kuitansi jual beli emas</h1>
<div class="panel">
<div class="seg" id="seg">
<button type="button" data-m="beli" class="on">Kuitansi pembelian</button>
<button type="button" data-m="jual">Kuitansi penjualan</button>
<button type="button" data-m="nota">Nota penjualan</button>
</div>
<div class="grid">
<label>Nomor kuitansi<input id="no"></label>
<label>Tanggal<input id="tgl" type="date"></label>
<label class="full">Lokasi transaksi<input id="lok" placeholder="Contoh: Sidoarjo"></label>
<label>Nama toko<input id="tk" value="Madina Gold"></label>
<label>WhatsApp toko<input id="tw" value="wa.me/6281217807058"></label>
</div>
<h2>Penjual</h2>
<div class="grid">
<label>Nama<input id="pn"></label>
<label>No. HP<input id="ph" inputmode="tel"></label>
<label class="full">Alamat / No. identitas (opsional)<input id="pa"></label>
</div>
<h2>Pembeli</h2>
<div class="grid">
<label>Nama<input id="bn"></label>
<label>No. HP<input id="bh" inputmode="tel"></label>
<label class="full">Alamat / No. identitas (opsional)<input id="ba"></label>
</div>
<h2>Barang</h2>
<div class="grid">
<label>Nama barang<input id="brg" value="Emas batangan Antam"></label>
<label>Berat (gram)<input id="brt" value="1"></label>
<label>Kadar<input id="kdr" value="999.9"></label>
<label>Jumlah (pcs)<input id="qty" type="number" min="1" value="1"></label>
<label>Nomor seri<input id="seri" placeholder="Contoh: K74288524"></label>
<label>Kode CertiEye<input id="ce" placeholder="Contoh: BBBHWF23319182"></label>
</div>
<h2>Pembayaran</h2>
<div class="grid">
<label>Total harga (Rp)<input id="hrg" inputmode="numeric" placeholder="0"></label>
<label>Metode<select id="mtd"><option>Tunai</option><option>Transfer bank</option><option>QRIS</option></select></label>
<label class="full">Tanda tangan penjual<select id="ttdm"><option value="basah">Tanda tangan basah (ditulis tangan)</option><option value="qr">Tanda tangan elektronik (QR)</option></select></label>
<label class="full">Catatan<textarea id="cat" rows="2">Barang telah diperiksa dan diterima dalam keadaan baik, segel utuh, dan keaslian dicek dengan aplikasi CertiEye.</textarea></label>
</div>
</div>
<div class="panel">
<div class="acts">
<button type="button" id="bp">Cetak / simpan PDF</button>
<button type="button" id="bc" class="alt">Salin teks</button>
<button type="button" id="bw" class="alt">Kirim teks ke WhatsApp</button>
</div>
<div id="msg" role="status"></div>
</div>
</div>

<div class="scroll"><div id="kw"></div></div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var mode="beli";
var S=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function t(n){
if(n<12)return S[n];
if(n<20)return t(n-10)+" belas";
if(n<100)return t(Math.floor(n/10))+" puluh"+(n%10?" "+t(n%10):"");
if(n<200)return "seratus"+(n>100?" "+t(n-100):"");
if(n<1000)return t(Math.floor(n/100))+" ratus"+(n%100?" "+t(n%100):"");
if(n<2000)return "seribu"+(n>1000?" "+t(n-1000):"");
if(n<1e6)return t(Math.floor(n/1e3))+" ribu"+(n%1e3?" "+t(n%1e3):"");
if(n<1e9)return t(Math.floor(n/1e6))+" juta"+(n%1e6?" "+t(n%1e6):"");
if(n<1e12)return t(Math.floor(n/1e9))+" miliar"+(n%1e9?" "+t(n%1e9):"");
return "";
}
function terbilang(n){return n>0?t(n).replace(/^./,function(c){return c.toUpperCase()})+" rupiah":"-"}
function rp(n){return "Rp "+n.toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function tglID(v){
if(!v)return "-";
var p=v.split("-");
var b=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
return parseInt(p[2],10)+" "+b[parseInt(p[1],10)-1]+" "+p[0];
}
function val(i){return $(i).value.trim()}
function data(){
var h=parseInt(val("hrg").replace(/\D/g,""),10)||0;
return {
judul:mode==="beli"?"KUITANSI PEMBELIAN EMAS":mode==="jual"?"KUITANSI PENJUALAN EMAS":"NOTA PENJUALAN EMAS",
ttdm:$("ttdm").value,tk:val("tk"),tw:val("tw"),
no:val("no")||"-",tgl:tglID($("tgl").value),lok:val("lok")||"-",
pn:val("pn")||"-",ph:val("ph")||"-",pa:val("pa")||"-",
bn:val("bn")||"-",bh:val("bh")||"-",ba:val("ba")||"-",
brg:val("brg")||"-",brt:val("brt")||"-",kdr:val("kdr")||"-",qty:val("qty")||"1",
seri:val("seri")||val("ce")||"-",ce:val("ce")||"-",
h:h,mtd:$("mtd").value,cat:val("cat")
};
}
function kode(d){
var s=[d.no,d.tgl,d.pn,d.bn,d.seri,d.h].join("|"),h=2166136261;
for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
return h.toString(16).toUpperCase().padStart(8,"0");
}
function row(a,b){return "<tr><td>"+a+"</td><td>: "+esc(b)+"</td></tr>"}
function brand(d){
if(!d.tk)return "";
var l=d.tw?" | WA <a href=\""+(/^https?:/.test(d.tw)?esc(d.tw):"https://"+esc(d.tw))+"\" style=\"color:inherit\">"+esc(d.tw)+"</a>":"";
return "<div class=\"br\">"+esc(d.tk)+l+"</div>";
}
function notaHtml(d){
var q=parseInt(d.qty,10)||1,u=d.h?Math.round(d.h/q):0;
var cat=d.cat?d.cat.split("\n").map(function(x){return "<div>"+esc(x)+"</div>"}).join(""):"";
return brand(d)+"<h3>"+d.judul+"</h3><div class=\"no\">No. "+esc(d.no)+" | "+esc(d.pn)+(d.ph!=="-"?" ("+esc(d.ph)+")":"")+"</div>"+
"<table><tr><td>Tanggal</td><td>: "+esc(d.tgl)+"</td></tr><tr><td>Nama</td><td>: "+esc(d.bn)+"</td></tr><tr><td>Alamat</td><td>: "+esc(d.ba)+"</td></tr></table>"+
"<table class=\"it\"><tr><th>Jumlah</th><th>Nama barang</th><th>No seri</th><th>Harga</th><th>Total</th></tr><tr><td>"+esc(d.qty)+"</td><td>"+esc(d.brg)+", "+esc(d.brt)+" g, kadar "+esc(d.kdr)+"</td><td>"+esc(d.seri)+"</td><td>"+rp(u)+"</td><td>"+rp(d.h)+"</td></tr></table>"+
"<div class=\"amt\">TOTAL "+rp(d.h)+"</div><div class=\"tb\">Terbilang: "+esc(terbilang(d.h))+"</div>"+
"<div style=\"font-size:13px\">Pembayaran: "+esc(d.mtd)+(d.ce!=="-"&&d.ce!==d.seri?" | Kode CertiEye: "+esc(d.ce):"")+"</div>"+
(cat?"<div class=\"note\">"+cat+"</div>":"")+
"<div class=\"note\" style=\"border:0;margin-top:4px\">"+esc(d.lok)+", "+esc(d.tgl)+"</div>";
}
function render(){
var d=data();
$("ttdm").parentNode.style.display=mode==="nota"?"none":"";
if(mode==="nota"){$("kw").innerHTML=notaHtml(d);return}
$("kw").innerHTML=
brand(d)+"<h3>"+d.judul+"</h3><div class=\"no\">No. "+esc(d.no)+"</div>"+
"<table>"+
row("Penjual",d.pn+" (HP "+d.ph+")")+
(d.pa!=="-"?row("Alamat / ID penjual",d.pa):"")+
row("Pembeli",d.bn+" (HP "+d.bh+")")+
(d.ba!=="-"?row("Alamat / ID pembeli",d.ba):"")+
(mode==="nota"?
row("Nomor seri",d.seri)+row("Kode CertiEye",d.ce)+row("Pembayaran",d.mtd)+"</table>"+
"<table class=\"it\"><tr><th>Barang</th><th>Berat</th><th>Kadar</th><th>Qty</th><th>Harga</th></tr><tr><td>"+esc(d.brg)+"</td><td>"+esc(d.brt)+" g</td><td>"+esc(d.kdr)+"</td><td>"+esc(d.qty)+"</td><td>"+(d.h?rp(d.h):"Rp 0")+"</td></tr></table>"
:
row("Barang",d.brg+", "+d.brt+" gram, kadar "+d.kdr+", "+d.qty+" pcs")+
row("Nomor seri",d.seri)+
row("Kode CertiEye",d.ce)+
row("Pembayaran",d.mtd)+
"</table>")+
"<div class=\"amt\">"+(d.h?rp(d.h):"Rp 0")+"</div>"+
"<div class=\"tb\">Terbilang: "+esc(terbilang(d.h))+"</div>"+
(d.cat?"<div style=\"font-size:13px\">Catatan: "+esc(d.cat)+"</div>":"")+
"<div class=\"ttd\"><div>Penjual<div class=\"sp\" style=\"height:84px\">"+(d.ttdm==="qr"?"<div id=\"qrp\" style=\"display:inline-block;margin-top:4px\"></div>":"")+"</div>("+esc(d.pn)+")"+(d.ttdm==="qr"?"<div style=\"font-size:10px\">TTD elektronik, kode "+kode(d)+"</div>":"")+"</div><div>Pembeli<div class=\"sp\"></div>("+esc(d.bn)+")</div></div>"+
"<div class=\"note\">"+esc(d.lok)+", "+esc(d.tgl)+". Dokumen ini dibuat sebagai bukti serah terima barang dan pembayaran.</div>";
if(d.ttdm==="qr"){var q=$("qrp");if(q){
if(typeof QRCode!=="undefined"){try{new QRCode(q,{text:"TTD ELEKTRONIK\nNo: "+d.no+"\nTgl: "+d.tgl+"\nPenandatangan (penjual): "+d.pn+"\nPembeli: "+d.bn+"\nTotal: "+rp(d.h)+"\nKode: "+kode(d),width:76,height:76,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent="[QR gagal dibuat]"}}
else{q.textContent="[QR belum termuat]"}
}}
}
function teks(){
var d=data();
return [(d.tk?d.tk+(d.tw?" | WA "+d.tw:"")+"\n":"")+d.judul,"No. "+d.no,d.lok+", "+d.tgl,"",
"Penjual: "+d.pn+" ("+d.ph+")",
"Pembeli: "+d.bn+" ("+d.bh+")",
"Barang: "+d.brg+", "+d.brt+" gram, kadar "+d.kdr+", "+d.qty+" pcs",
"No. seri: "+d.seri,
"Kode CertiEye: "+d.ce,
"Total: "+rp(d.h)+" ("+terbilang(d.h)+")",
"Pembayaran: "+d.mtd,
d.cat?"Catatan: "+d.cat:"",d.ttdm==="qr"&&mode!=="nota"?"TTD elektronik penjual, kode "+kode(d):"",
"","Telah diterima dan disetujui kedua belah pihak."].filter(function(x,i,a){return x!==""||a[i-1]!==""}).join("\n");
}
function say(m){$("msg").textContent=m}
function salin(s){
if(navigator.clipboard&&navigator.clipboard.writeText){
return navigator.clipboard.writeText(s).then(function(){return true},function(){return false});
}
return Promise.resolve(false);
}
function fallback(s){
var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();
var ok=false;try{ok=document.execCommand("copy")}catch(e){}
document.body.removeChild(a);return ok;
}
$("bp").onclick=function(){
render();
try{window.print()}catch(e){say("Cetak tidak tersedia di sini. Buka halaman ini di browser lalu coba lagi.")}
};
$("bc").onclick=function(){
var s=teks();
salin(s).then(function(ok){say(ok||fallback(s)?"Teks tersalin.":"Gagal menyalin. Tekan lama teks kuitansi lalu salin manual.")});
};
$("bw").onclick=function(){
var s=teks();
var w=window.open("https://wa.me/?text="+encodeURIComponent(s),"_blank");
if(!w){salin(s).then(function(ok){say(ok||fallback(s)?"WhatsApp tidak bisa dibuka dari sini. Teks sudah disalin, tempel di chat.":"WhatsApp tidak bisa dibuka dan teks gagal disalin.")})}
};
Array.prototype.forEach.call(document.querySelectorAll("#seg button"),function(b){
b.onclick=function(){
mode=b.getAttribute("data-m");
Array.prototype.forEach.call(document.querySelectorAll("#seg button"),function(x){x.classList.toggle("on",x===b)});
render();
};
});
Array.prototype.forEach.call(document.querySelectorAll("input,select,textarea"),function(e){
e.addEventListener("input",render);e.addEventListener("change",render);
});
var n=new Date(),p=function(x){return String(x).padStart(2,"0")};
$("tgl").value=n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate());
$("no").value="KW/"+n.getFullYear()+p(n.getMonth()+1)+p(n.getDate())+"/001";
render();
})();
</script>
</body>
</html>
